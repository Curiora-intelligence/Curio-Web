<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Curio, your AI workspace by Curiora.">
  <title>Curio · Curiora</title>
  <link rel="icon" href="{{ url_for('static', path=static_version + '/img/curio.svg') }}" type="image/svg+xml">
  {% for sheet in ['tokens', 'base', 'materials', 'app', 'chat', 'memory', 'live'] %}
  <link rel="stylesheet" href="{{ url_for('static', path=static_version + '/css/' + sheet + '.css') }}">
  {% endfor %}
</head>
<body>
  {% from 'components/icons.html' import icon %}
  {% block content %}{% endblock %}
  {% include 'components/auth.html' %}
  <script id="curio-config" type="application/json">{{ config | tojson }}</script>
  <script type="module" src="{{ url_for('static', path=static_version + '/js/app.js') }}"></script>
</body>
</html>
