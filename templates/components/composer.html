<div class="composer-dock">
  <div id="notice" class="notice error composer-notice" role="status" hidden><span id="notice-message"></span><button type="button" class="icon-button" id="dismiss-notice" aria-label="Dismiss message">{{ icon('close',16) }}</button></div>
  <form class="composer glass" id="chat-form">
    <div id="attachment" class="attachment" hidden><span></span><button type="button" id="remove-image" class="icon-button" aria-label="Remove image">{{ icon('close',16) }}</button></div>
    <div class="composer-row">
      <input type="file" id="image-file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
      <button type="button" class="icon-button" id="attach-image" aria-label="Attach an image" title="Attach an image">{{ icon('plus') }}</button>
      <label class="sr-only" for="message">Message Curio</label>
      <textarea id="message" rows="1" maxlength="16000" placeholder="Ask Curio anything…" aria-describedby="composer-note voice-status"></textarea>
      <button type="button" class="icon-button" id="microphone" aria-label="Dictate a message" title="Dictate a message" aria-pressed="false">{{ icon('mic') }}</button>
      <button type="button" class="icon-button" id="open-live" aria-label="Open Curio Speak" title="Curio Speak">{{ icon('speak') }}</button>
      <button type="submit" class="send-button" id="send" aria-label="Send message" disabled>{{ icon('arrow') }}</button>
    </div>
  </form>
  <div class="composer-feedback"><p class="composer-note" id="composer-note" role="status"></p><p class="voice-status" id="voice-status" role="status" hidden></p></div>
</div>
