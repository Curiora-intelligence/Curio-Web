{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if name == 'panel' %}
    <rect x="3" y="4" width="18" height="16" rx="3" />
    <path d="M9 4v16" />
    {% elif name == 'search' %}
    <circle cx="10.5" cy="10.5" r="6.5" />
    <path d="m16 16 4 4" />
    {% elif name == 'edit' %}
    <path d="M12 5H6a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-6M10 14l1-4L19 2l3 3-8 8-4 1Z" />
    {% elif name == 'memory' %}
    <rect x="4" y="3" width="16" height="18" rx="3" />
    <path d="M9 3v18M13 8h3M13 12h3" />
    {% elif name == 'temporary' %}
    <path
        d="M8 3.8a9 9 0 0 1 4-1M16 3.8a9 9 0 0 1 4.2 4.4M21 12a9 9 0 0 1-1 4M17 19.5a9 9 0 0 1-5 1.5M8 20l-5 1 1-5M3 12a9 9 0 0 1 1-4M5 5.5l.5-.5" />
    {% elif name == 'clock' %}
    <circle cx="12" cy="12" r="9" />
    <path d="M12 7v5l3 2" />
    {% elif name == 'plus' %}
    <path d="M12 5v14M5 12h14" />
    {% elif name == 'mic' %}
    <rect x="9" y="3" width="6" height="11" rx="3" />
    <path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3M8 22h8" />
    {% elif name == 'arrow' %}
    <path d="M12 19V5m-6 6 6-6 6 6" />
    {% elif name == 'speak' %}
    {% include 'components/curiora_voice.html' %}
    {% elif name == 'desktop' %}
    <rect x="3" y="4" width="18" height="13" rx="2" />
    <path d="M8 21h8M12 17v4" />
    {% elif name == 'close' %}
    <path d="m6 6 12 12M6 18 12 6" />
    {% elif name == 'idea' %}
    <path d="M9 18h6M10 21h4M8 15a7 7 0 1 1 8 0l-1 3H9l-1-3Z" />
    {% elif name == 'document' %}
    <path d="M14 3H5v18h14V8l-5-5Zm0 0v5h5M8 12h8M8 16h6" />
    {% elif name == 'chevron' %}
    <path d="m8 10 4 4 4-4" />
    {% elif name == 'check' %}
    <path d="m5 12 4 4L19 6" />
    {% elif name in ['photo','image'] %}
    <rect x="3" y="3" width="18" height="18" rx="3" />
    <circle cx="8" cy="8" r="1.5" />
    <path d="m3 17 5-5 4 4 4-6 5 7" />
    {% elif name == 'library' %}
    <rect x="3" y="4" width="5" height="16" rx="1" />
    <rect x="10" y="4" width="5" height="16" rx="1" />
    <path d="m18 4 3 15" />
    {% elif name == 'globe' %}
    <circle cx="12" cy="12" r="9" />
    <ellipse cx="12" cy="12" rx="4" ry="9" />
    <path d="M3 12h18" />
    {% elif name == 'mail' %}
    <rect x="3" y="5" width="18" height="14" rx="3" />
    <path d="m4 7 8 6 8-6" />
    {% elif name == 'github' %}
    <path
        d="M9 19c-4 1-4-2-6-2m12 5v-4c0-1-.3-2-1-2 4-.5 7-2 7-6 0-2-1-3-2-4 0-1 0-3-.5-4-2 0-3 1-4 2a12 12 0 0 0-5 0C8 3 7 2 5 2c-.5 1-.5 3-.5 4-1 1-2 2-2 4 0 4 3 5.5 7 6-.7.5-1 1-1 2v4" />
    {% endif %}
</svg>
{%- endmacro %}
