<dialog id="auth-dialog" class="dialog"><h2>Sign in to Curio</h2><p>Your services, preferences, and history belong to your account.</p><form id="auth-form"><label class="field-label">Email<input class="input" name="email" type="email" required autocomplete="username" maxlength="254"></label><label class="field-label">Password<input class="input" name="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password"></label><div id="registration-fields" hidden><label class="field-label">Name<input class="input" name="name" maxlength="120"></label><label class="field-label">Account type<select class="input" name="role"><option value="USER">User</option><option value="PROVIDER">Service provider</option></select></label></div><p id="auth-error" role="alert" class="notice error" hidden></p><button class="primary" type="submit" id="auth-submit">Sign in</button><button class="text-button" type="button" id="auth-switch">Create an account</button></form></dialog>
