<section id="work-panel" class="workspace work-panel" role="tabpanel" aria-labelledby="work-tab" hidden>
  <div class="welcome"><h1>What should we work on?</h1></div>
  <div class="work-content">
    <div class="composer work-composer glass">
      <label class="sr-only" for="work-message">Task draft</label>
      <textarea id="work-message" rows="3" maxlength="16000" placeholder="Describe a task for Curio" aria-describedby="work-availability"></textarea>
      <div class="composer-actions"><button type="button" class="icon-button" disabled aria-label="Work file attachments are not available" title="File attachments aren't available in Work">{{ icon('plus') }}</button><span class="spacer"></span><button type="button" class="send-button" disabled aria-label="Work execution is not available" title="Work execution isn't connected yet">{{ icon('arrow') }}</button></div>
    </div>
    <div class="work-context"><p id="work-availability">Task execution and file deliverables aren't connected yet.</p><button class="text-button" id="continue-in-chat" disabled>Continue in Chat <span aria-hidden="true">↗</span></button></div>
    <div class="work-examples" aria-label="Task draft starters">
      <button type="button" data-work-prompt="Help me outline a plan. Here is what I want to achieve: ">{{ icon('document') }}<strong>Outline a plan</strong><span>Start with a clear direction.</span></button>
      <button type="button" data-work-prompt="Help me shape a document from these notes: ">{{ icon('edit') }}<strong>Shape a document</strong><span>Give your ideas a structure.</span></button>
      <button type="button" data-work-prompt="Help me think through this problem and its tradeoffs: ">{{ icon('idea') }}<strong>Think it through</strong><span>Make room for a better approach.</span></button>
    </div>
  </div>
</section>
